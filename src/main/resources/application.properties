# =============================================================
# Quantity Measurement Application - Development Configuration
# =============================================================

# Application name and active profile
spring.application.name=quantity-measurement-app
#spring.profiles.active=dev
spring.profiles.active=prod

# =============================================================
# H2 In-Memory Database Configuration (Development)
# Using in-memory H2 for ease of development and testing.
# The H2 console is enabled for direct database inspection.
# =============================================================


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update


# MySQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================================
# Connection Pool Settings (HikariCP — Spring Boot default)
# =============================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=QuantityMeasurementPool

# ============================================================
# Logging Configuration
# DEBUG for application and Spring web/Hibernate SQL in development
# =============================================================
logging.level.root=INFO
logging.level.com.app.quantitymeasurement=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# =============================================================
# Swagger / OpenAPI Configuration
# Swagger UI: http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
# =============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true



# =============================================================
# Spring Boot Actuator Configuration
# Health, metrics, and info endpoints for monitoring
# =============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Quantity Measurement App
info.app.version=17.0
info.app.description=Spring Boot REST API for quantity measurement operations
