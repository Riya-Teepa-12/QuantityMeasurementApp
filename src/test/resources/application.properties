# =============================================================
# Test Configuration — overrides main application.properties
# Uses H2 in-memory with create-drop for clean test isolation
# =============================================================


spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Suppress excessive Hibernate logging in tests
logging.level.root=WARN
logging.level.com.app.quantitymeasurement=INFO
logging.level.org.hibernate.SQL=WARN

# Swagger and Actuator in test
springdoc.swagger-ui.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# ✅ Dummy OAuth config for tests


spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo